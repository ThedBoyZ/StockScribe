# CD · after CI passes on main: build images → push to GHCR → deploy to the EC2 VM.
#
#   prepare → build (api, migrator, web in parallel) → deploy (SSH: deploy/scripts/deploy.sh)
#
# Needs (Settings → Secrets and variables → Actions):
#   secrets  EC2_HOST         Elastic IP of the VM
#            EC2_SSH_KEY      private key of the deploy key pair (its .pub is in ~/.ssh/authorized_keys on the VM)
#            EC2_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <EC2_HOST>`
#   vars     DOMAIN           e.g. yourname.duckdns.org
#
# Database connection strings are NOT here: they live only in /opt/stockscribe/.env on the VM.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # redeploy main by hand (Actions → CD → Run workflow)

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    # Only after a green CI run on main (not PR runs), or a manual run on main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase (owner is ThedBoyZ).
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: apps/api
            target: api
          - image: migrator
            context: apps/api
            target: migrator
          - image: web
            context: apps/web
            target: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: |
            ${{ needs.prepare.outputs.registry }}/stockscribe-${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/stockscribe-${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to EC2
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Secrets pasted from Windows can carry CRLF line endings, which OpenSSH rejects
          # ("error in libcrypto"). Strip them, and fail early with a clear message.
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::EC2_SSH_KEY is not a valid private key. Paste the whole file, BEGIN and END lines included."
            exit 1
          fi
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $EC2_HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Upload deploy files
        run: >-
          tar -C deploy -czf - docker-compose.prod.yml nginx scripts
          | ssh vm 'tar -xzf - -C /opt/stockscribe'

      # Short-lived login: GITHUB_TOKEN expires when this job ends. Logged out again below.
      - name: Log in to GHCR on the VM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | ssh vm "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy
        run: ssh vm "bash /opt/stockscribe/scripts/deploy.sh '$TAG'"

      - name: Smoke test (public URL)
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null "https://$DOMAIN/health/live"
          curl -fsS "https://$DOMAIN/" | grep -q '<div id="__nuxt"'
          curl -fsS -o /dev/null "https://$DOMAIN/po/123"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://$DOMAIN/")" = "301"
          echo "Live: https://$DOMAIN ($TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR on the VM
        if: always()
        run: ssh vm 'docker logout ghcr.io' || true
