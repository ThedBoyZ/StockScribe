# CI · runs on every PR to main and every push to main.
#
#   api     → build (warnings as errors) + unit & integration tests (Testcontainers)
#   web     → typecheck + `nuxt generate`
#   docker  → `docker compose up --build` and smoke-test the whole stack through nginx
#
# The three job names are the required status checks in the main ruleset.
# No path filters on purpose: a required check that never runs would block docs-only PRs.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  api:
    name: API - build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StockScribe.slnx

      - name: Build
        run: dotnet build StockScribe.slnx --no-restore --configuration Release -warnaserror

      # Integration tests start PostgreSQL and MongoDB containers (Docker is preinstalled on ubuntu-latest).
      - name: Test
        run: >-
          dotnet test StockScribe.slnx --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: apps/api/TestResults
          retention-days: 7

  web:
    name: Web - typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run generate

  docker:
    name: Docker - compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for /health/ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "::error::/health/ready did not return 200 within 120 s"
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:8080

          # Migrations ran and exited cleanly.
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"

          # Readiness reports both databases.
          curl -fsS "$base/health/ready" | tee /dev/stderr | grep -q '"status":"Healthy"'
          curl -fsS -o /dev/null "$base/health/live"

          # nginx serves the SPA, including client-side routes (fallback to index.html).
          curl -fsS "$base/" | grep -q '<div id="__nuxt"'
          curl -fsS -o /dev/null "$base/po/123"

          # Unknown API routes come back from the API as ProblemDetails.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/does-not-exist")" = "404"

          # Demo login (Slice 1): no session → 401; pick the first persona → cookie → /me.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/me")" = "401"
          persona=$(curl -fsS "$base/api/v1/auth/personas" | jq -r '.[0].id')
          curl -fsS -c cookies.txt -H 'content-type: application/json' \
            -d "{\"personaId\":\"$persona\"}" "$base/api/v1/auth/demo-login" > /dev/null
          curl -fsS -b cookies.txt "$base/api/v1/me" | tee /dev/stderr | grep -q '"role":"BranchManager"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
