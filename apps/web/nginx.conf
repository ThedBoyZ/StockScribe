# -----------------------------------------------------------------------------
# apps/web/nginx.conf · nginx INSIDE the `web` image (container port 80)
#
# Job: serve the static Nuxt SPA and forward /api + /health to the `api`
# container on the compose network, so the browser only talks to one origin.
#
# This is NOT the public front proxy. TLS (Let's Encrypt), the domain name and
# security headers live in deploy/nginx/ on the VM, which proxies to this one.
# -----------------------------------------------------------------------------

# Keep the original scheme when a TLS proxy sits in front of us.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's DNS. Resolving per request (via the variable below) lets nginx start
    # even if `api` is down, and picks up a new IP when the api container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /health/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed build assets never change → cache for a year.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell must always be revalidated so new deploys show up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths (e.g. /po/123) load index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
